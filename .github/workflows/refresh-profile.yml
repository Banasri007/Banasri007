name: Refresh profile

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-profile.yml'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build original artwork
        run: node scripts/build-art.mjs
      - name: Generate Commit Arcade
        uses: Nicsilver/commit-arcade@481aa09bb80af39684132b647d928b70b6fd19b8
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/arcade.svg?game=tron&theme=neon&accent=%2365e2ee&levels=%23213d61,%23335f8d,%234e9dc5,%2378def1&sprites=%23213d61,%23335f8d,%234e9dc5,%2378def1
      - name: Save refreshed artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "Artwork is already current."
          else
            git commit -m "Refresh profile artwork"
            git pull --rebase origin main
            git push
          fi

